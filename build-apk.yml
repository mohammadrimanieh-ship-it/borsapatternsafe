name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify signing secrets
        env:
          KS: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 }}
          SP: ${{ secrets.BORSAPATTERN_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.BORSAPATTERN_KEY_ALIAS }}
          KP: ${{ secrets.BORSAPATTERN_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Add the four BORSAPATTERN_* secrets before building."
            exit 1
          fi

      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.BORSAPATTERN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/borsapattern-release.jks"

      - name: Build signed release APK
        env:
          BORSAPATTERN_KEYSTORE_PATH: ${{ runner.temp }}/borsapattern-release.jks
          BORSAPATTERN_KEYSTORE_PASSWORD: ${{ secrets.BORSAPATTERN_KEYSTORE_PASSWORD }}
          BORSAPATTERN_KEY_ALIAS: ${{ secrets.BORSAPATTERN_KEY_ALIAS }}
          BORSAPATTERN_KEY_PASSWORD: ${{ secrets.BORSAPATTERN_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signal-v3.1.0-safe
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
